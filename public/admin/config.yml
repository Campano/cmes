# Sveltia CMS – https://sveltiacms.app/en/docs/config-basics
# backend.base_url = the site origin, set in index.html; login: functions/api/auth.js (Cloudflare Access).
# No publish_mode: "Desa" commits straight to main (D19).
backend:
  name: github
  repo: Campano/cmes
  branch: main
  auth_endpoint: api/auth
  commit_messages:
    create: '[cms] Create {{collection}} "{{slug}}"'
    update: '[cms] Update {{collection}} "{{slug}}"'
    delete: '[cms] Delete {{collection}} "{{slug}}"'
    uploadMedia: '[cms] Upload "{{path}}"'
    deleteMedia: '[cms] Delete "{{path}}"'
# "Tanca la sessió" also ends the Cloudflare Access session, otherwise reloading /admin/ signs straight back in.
logout_redirect_url: /cdn-cgi/access/logout
# UI language follows the browser (Catalan available, English fallback); no `locale` option.
# Leave empty optional fields out: an empty `image` would be a broken cover path.
output: {omit_empty_optional_fields: true}
media_folder: public/img
public_folder: /img
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: posts
    label: Notícies
    label_singular: Notícia
    description: Després de **Desa**, el canvi triga uns 1–2 minuts a sortir al web.
    folder: content/noticies
    path: '{{year}}-{{month}}-{{day}}-{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    format: frontmatter
    extension: md
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    sortable_fields: {fields: [date, title], default: {field: date, direction: descending}}
    fields:
      - {label: Títol, name: title, widget: string}
      - {label: Data, name: date, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ss', default: '{{now}}'}
      - label: Categories
        name: tags
        widget: select
        multiple: true
        min: 1
        options: [Actualitat, Barranquisme, Curses per muntanya, Escalada, Senderisme]
        hint: L'adreça és /noticies/ més el nom de la carpeta (data-títol). La primera categoria no hi surt.
      - {label: Imatge destacada, name: image, widget: image, required: false}
      - {label: Resum, name: description, widget: text, required: false, hint: Una o dues frases per a cercadors i xarxes socials.}
      - {label: Text, name: body, widget: markdown, hint: 'Retorn fa un paràgraf nou. Maj+Retorn no es veu al web.'}

  - name: pages
    label: Pàgines
    description: Després de **Desa**, el canvi triga uns 1–2 minuts a sortir al web.
    format: frontmatter
    files:
      - {label: Inici (text del club), name: inici, file: content/pages/_inici.md, fields: [{label: Text, name: body, widget: markdown}]}
      - label: Local social
        name: local-social
        file: content/pages/local-social.md
        fields: &md
          - {label: Títol, name: title, widget: string}
          - {label: Descripció, name: description, widget: string, required: false}
          - {label: Text, name: body, widget: markdown}
      - {label: "Protocol d'accidents", name: protocol-accidents, file: content/pages/protocol-accidents.md, fields: *md}
      - {label: Participació, name: participacio, file: content/pages/participacio.md, fields: *md}
      # .mdx pages: raw markdown only, so <Site field="…" /> tags stay intact.
      - label: Informació
        name: el-club
        file: content/pages/el-club.mdx
        fields: &mdx
          - {label: Títol, name: title, widget: string}
          - {label: Descripció, name: description, widget: string, required: false}
          - {label: Text, name: body, widget: markdown, modes: [raw], hint: 'Etiquetes: <Site field="…" /> (configuració) i <Copy text="…" /> (botó per copiar).'}
      - {label: Equip, name: equip, file: content/pages/equip.mdx, fields: *mdx}
      - {label: Fes-te soci, name: fes-te-soci, file: content/pages/fes-te-soci.mdx, fields: *mdx}
      - {label: Contacte, name: contacte, file: content/pages/contacte.mdx, fields: *mdx}
      - {label: Avís legal, name: avis-legal, file: content/pages/avis-legal.md, fields: *md}
      - {label: Política de privacitat, name: politica-de-privacitat, file: content/pages/politica-de-privacitat.md, fields: *md}
      - {label: Política de cookies, name: politica-de-cookies, file: content/pages/politica-de-cookies.md, fields: *md}

  - name: settings
    label: Configuració
    description: Després de **Desa**, el canvi triga uns 1–2 minuts a sortir al web.
    editor: {preview: false}
    files:
      - name: site
        label: Dades del club
        file: content/site.json
        format: json
        fields:
          - {label: Nom del web, name: title, widget: string}
          - {label: Lema, name: tagline, widget: string}
          - {label: Correu electrònic, name: email, widget: string}
          - {label: Formulari de contacte (URL curta), name: contactFormUrl, widget: string, hint: 'Enllaç forms.gle per obrir en pestanya nova.'}
          - {label: Formulari de contacte (incrustat), name: contactFormEmbedUrl, widget: string, hint: 'URL docs.google.com/.../viewform?embedded=true (Google → Envia → Incrustar).'}
          - {label: Calendari (incrustat), name: calendarEmbedUrl, widget: string, hint: 'URL calendar.google.com/calendar/embed?... (Google Calendar → Configuració → Integrar calendari).'}
          - {label: Adreça, name: address, widget: string}
          - {label: NIF, name: nif, widget: string}
          - {label: Banc, name: bank, widget: string}
          - {label: IBAN, name: iban, widget: string}
          - label: Xarxes socials
            name: social
            widget: list
            fields:
              - {label: Nom, name: label, widget: string}
              - {label: Enllaç, name: href, widget: string}
          - label: Seccions (menú i portada)
            name: sections
            widget: list
            fields:
              - {label: Nom, name: label, widget: string}
              - {label: Adreça, name: to, widget: string, hint: 'Pàgina de la categoria, p. ex. /noticies/senderisme/'}
