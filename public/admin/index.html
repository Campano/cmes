<!doctype html>
<!-- translate="no": browser auto-translation rewrites the DOM and breaks the editor. -->
<html lang="ca" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>CMES · Gestor de continguts</title>
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <!-- SRI covers this file only; it lazy-loads its locale and chunk files from the same pinned version. -->
  <script src="https://unpkg.com/@sveltia/cms@0.250.0/dist/sveltia-cms.js"
    integrity="sha384-ZsKrJb+2fz2LQAmNGNALsLSBhiMyQEzAbodz2oj3+UYyp+OKIEwEJB259KvvZZo+"
    crossorigin="anonymous"></script>
  <!-- Login runs on this same origin (functions/api/auth.js), so it works on *.pages.dev and on the final domain. -->
  <!-- Access has already logged the editor in: seed Sveltia's session ('sveltia-cms.user', check it on every
       upgrade) so it skips its sign-in screen. On any failure the usual "Sign in with GitHub" button shows. -->
  <script>
    const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const boot = () => CMS.init({config: {backend: {base_url: location.origin}}});
    const dbg = (hypothesisId, message, data) => {
      // #region agent log
      fetch('http://127.0.0.1:7908/ingest/63ddbb8f-c47f-4720-8df1-9ce1f52001e0',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'15155e'},body:JSON.stringify({sessionId:'15155e',runId:'sveltia-login',hypothesisId,location:'public/admin/index.html',message,data:{...data,host:location.hostname,path:location.pathname},timestamp:Date.now()})}).catch(()=>{});
      // #endregion
    };
    if (local) {
      dbg('F', 'local boot skips /api/token', {local: true});
      boot();
    } else {
      fetch('/api/token')
        .then(async (r) => {
          const reason = r.headers.get('X-Cmes-Reason');
          const type = r.headers.get('content-type') || '';
          const text = await r.text();
          let data = null;
          try { data = JSON.parse(text); } catch { /* Access HTML or Forbidden text */ }
          const bodyKind = data ? 'json' : (text.startsWith('Forbidden:') ? 'forbidden' : (text.includes('<') ? 'html' : 'other'));
          dbg(r.ok ? 'C' : 'A', '/api/token response', {ok: r.ok, status: r.status, type, reason, bodyKind, hasToken: Boolean(data?.token), forbidden: bodyKind === 'forbidden' ? text.slice(0, 80) : undefined});
          if (!r.ok) console.warn('/api/token', text);
          return data;
        })
        .then((d) => {
          if (d?.token) localStorage.setItem('sveltia-cms.user', JSON.stringify({backendName: 'github', token: d.token}));
          dbg('D', 'session seed', {seeded: Boolean(d?.token), userKey: Boolean(localStorage.getItem('sveltia-cms.user'))});
        })
        .catch((e) => { dbg('E', '/api/token fetch failed', {err: String(e && e.message || e)}); })
        .finally(boot);
    }
  </script>
</body>
</html>
