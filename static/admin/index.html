<!doctype html>
<!-- translate="no": browser auto-translation rewrites the DOM under React and breaks the rich text editor. -->
<html lang="ca" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>CMES · Gestor de continguts</title>
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <!-- SRI covers this file only; it lazy-loads its locale and chunk files from the same pinned version. -->
  <script src="https://unpkg.com/@sveltia/cms@0.250.0/dist/sveltia-cms.js"
    integrity="sha384-ZsKrJb+2fz2LQAmNGNALsLSBhiMyQEzAbodz2oj3+UYyp+OKIEwEJB259KvvZZo+"
    crossorigin="anonymous"></script>
  <!-- Login runs on this same origin (functions/api/auth.js), so it works on *.pages.dev and on the final domain. -->
  <script>CMS.init({config: {backend: {base_url: location.origin}}});</script>
</body>
</html>
